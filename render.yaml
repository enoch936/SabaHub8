services:
  - type: web
    name: sabahub-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./backend-spring
    dockerfilePath: ./backend-spring/Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70.0 -Djava.net.preferIPv4Stack=true
      - key: MANAGEMENT_HEALTH_SHOW_DETAILS
        value: never
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: SABAHUB_PAYMENT_STORE
        value: postgres
      - key: SABAHUB_PAYMENT_DB_URL
        sync: false
      - key: SABAHUB_PAYMENT_DB_USER
        sync: false
      - key: SABAHUB_PAYMENT_DB_PASSWORD
        sync: false
      - key: SABAHUB_PAYMENT_DB_POOL_SIZE
        value: "10"
      - key: SABAHUB_PAYMENT_BACKFILL
        value: "false"
      - key: APP_JWT_SECRET
        generateValue: true
      - key: WALLET_ENCRYPTION_KEY
        generateValue: true
      - key: APP_PUBLIC_URL
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_TLS_ENABLED
        value: "false"
      - key: SMTP_SSL_ENABLED
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_WEBHOOK_SECRET
        sync: false
      - key: CHAPA_CALLBACK_URL
        sync: false
      - key: CHAPA_RETURN_URL
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_RETURN_URL
        sync: false
      - key: STRIPE_CANCEL_URL
        sync: false
      - key: AI_ENGINE_MODE
        value: HYBRID
      - key: AI_ENGINE_PYTHON_ENABLED
        value: "true"
      - key: AI_ENGINE_PYTHON_BASE_URL
        sync: false

  - type: web
    name: sabahub-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./ai-python
    dockerfilePath: ./ai-python/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
