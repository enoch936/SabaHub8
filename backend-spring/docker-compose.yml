version: "3.9"
services:
  redis:
    image: redis:7-alpine
    container_name: sabahub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: sabahub-backend-spring
    environment:
      - SERVER_PORT=8080
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI:?Set SPRING_DATA_MONGODB_URI (MongoDB Atlas SRV URI) in backend-spring/.env}
      - MONGODB_URI=${SPRING_DATA_MONGODB_URI}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - APP_JWT_EXPIRATION=${APP_JWT_EXPIRATION}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:3000
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_AUTH=${SMTP_AUTH}
      - SMTP_TLS_ENABLED=${SMTP_TLS_ENABLED}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_VERIFY_SERVICE_SID=${TWILIO_VERIFY_SERVICE_SID}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
    ports:
      - "8080:8080"
    depends_on:
      - redis
volumes:
  redis_data:
