version: "3.9"
services:
  mongo:
    image: mongo:7
    container_name: sabahub-mongo
    restart: unless-stopped
    command: mongod --bind_ip_all
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: sabahub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ai-python:
    build:
      context: ../ai-python
      dockerfile: Dockerfile
    container_name: sabahub-ai-python
    restart: unless-stopped
    environment:
      - AI_DATASET_DIR=/app/ADATASETES
      - AI_MODEL_DIR=/app/models
      - PYTHONUNBUFFERED=1
    ports:
      - "8090:8090"
    volumes:
      - ../ai-python/models:/app/models
      - ../ai-python/ADATASETES:/app/ADATASETES
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health').read(); sys.exit(0)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    build: .
    container_name: sabahub-backend-spring
    env_file:
      - .env
    environment:
      - SERVER_PORT=8080
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/SabaHub
      - MONGODB_URI=mongodb://mongo:27017/SabaHub
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - AI_ENGINE_PYTHON_BASE_URL=http://ai-python:8090
      - AI_ENGINE_MODE=HYBRID
      - AI_ENGINE_PYTHON_ENABLED=true
      - APP_CORS_ALLOWED_ORIGINS=http://localhost:3000
      - MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS=always
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-python:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mongo_data:
  redis_data:
