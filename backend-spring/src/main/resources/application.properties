# Spring app port (leave 3000 free for Next.js)
server.port=8080

# MongoDB connection (required; prefer Spring-standard env var)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI}}

# ========== Cloudinary Configuration ==========
# Core Credentials
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.secure=${CLOUDINARY_SECURE:true}

# Folder Structure
cloudinary.folder.images=${CLOUDINARY_FOLDER_IMAGES:sabahub/images}
cloudinary.folder.profile-images=${CLOUDINARY_FOLDER_PROFILE_IMAGES:sabahub/images/profiles}
cloudinary.folder.post-images=${CLOUDINARY_FOLDER_POST_IMAGES:sabahub/images/posts}
cloudinary.folder.gallery-images=${CLOUDINARY_FOLDER_GALLERY_IMAGES:sabahub/images/gallery}
cloudinary.folder.company-logos=${CLOUDINARY_FOLDER_COMPANY_LOGOS:sabahub/images/logos}
cloudinary.folder.videos=${CLOUDINARY_FOLDER_VIDEOS:sabahub/videos}
cloudinary.folder.training-videos=${CLOUDINARY_FOLDER_TRAINING_VIDEOS:sabahub/videos/training}
cloudinary.folder.promo-videos=${CLOUDINARY_FOLDER_PROMO_VIDEOS:sabahub/videos/promotional}
cloudinary.folder.user-videos=${CLOUDINARY_FOLDER_USER_VIDEOS:sabahub/videos/user-content}
cloudinary.folder.audios=${CLOUDINARY_FOLDER_AUDIOS:sabahub/audios}
cloudinary.folder.podcasts=${CLOUDINARY_FOLDER_PODCASTS:sabahub/audios/podcasts}
cloudinary.folder.voice-notes=${CLOUDINARY_FOLDER_VOICE_NOTES:sabahub/audios/voice-notes}
cloudinary.folder.audio-content=${CLOUDINARY_FOLDER_AUDIO_CONTENT:sabahub/audios/content}
cloudinary.folder.documents=${CLOUDINARY_FOLDER_DOCUMENTS:sabahub/documents}
cloudinary.folder.resumes=${CLOUDINARY_FOLDER_RESUMES:sabahub/documents/resumes}
cloudinary.folder.contracts=${CLOUDINARY_FOLDER_CONTRACTS:sabahub/documents/contracts}
cloudinary.folder.reports=${CLOUDINARY_FOLDER_REPORTS:sabahub/documents/reports}
cloudinary.folder.certificates=${CLOUDINARY_FOLDER_CERTIFICATES:sabahub/documents/certificates}
cloudinary.folder.files=${CLOUDINARY_FOLDER_FILES:sabahub/files}
cloudinary.folder.archives=${CLOUDINARY_FOLDER_ARCHIVES:sabahub/files/archives}
cloudinary.folder.spreadsheets=${CLOUDINARY_FOLDER_SPREADSHEETS:sabahub/files/spreadsheets}
cloudinary.folder.misc=${CLOUDINARY_FOLDER_MISC:sabahub/files/misc}

# Upload Limits (in bytes)
cloudinary.max.image-size=${CLOUDINARY_MAX_IMAGE_SIZE:10485760}
cloudinary.max.video-size=${CLOUDINARY_MAX_VIDEO_SIZE:104857600}
cloudinary.max.audio-size=${CLOUDINARY_MAX_AUDIO_SIZE:52428800}
cloudinary.max.document-size=${CLOUDINARY_MAX_DOCUMENT_SIZE:20971520}
cloudinary.max.file-size=${CLOUDINARY_MAX_FILE_SIZE:52428800}

# Allowed Formats
cloudinary.allowed.image-formats=${CLOUDINARY_ALLOWED_IMAGE_FORMATS:jpg,jpeg,png,gif,webp,svg,bmp,ico}
cloudinary.allowed.video-formats=${CLOUDINARY_ALLOWED_VIDEO_FORMATS:mp4,avi,mov,wmv,flv,webm,mkv,m4v}
cloudinary.allowed.audio-formats=${CLOUDINARY_ALLOWED_AUDIO_FORMATS:mp3,wav,ogg,aac,flac,m4a,wma}
cloudinary.allowed.document-formats=${CLOUDINARY_ALLOWED_DOCUMENT_FORMATS:pdf,doc,docx,xls,xlsx,ppt,pptx,txt,rtf,odt}
cloudinary.allowed.file-formats=${CLOUDINARY_ALLOWED_FILE_FORMATS:zip,rar,7z,tar,gz,csv,json,xml}

# Transformation Defaults
cloudinary.image.quality=${CLOUDINARY_IMAGE_QUALITY:auto:good}
cloudinary.image.fetch-format=${CLOUDINARY_IMAGE_FETCH_FORMAT:auto}
cloudinary.video.quality=${CLOUDINARY_VIDEO_QUALITY:auto:good}

# JWT
app.jwt.secret=${APP_JWT_SECRET:MzJieXRlc2VjcmV0Zm9yZGV2dXNlMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}
app.jwt.expiration-millis=${APP_JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://*.app.github.dev,http://localhost:3000,http://localhost:5173}

# Actuator
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info

# Rate limiting defaults
rate.limit.window-seconds=60
rate.limit.chapa-init-per-minute=5
rate.limit.local-request-per-minute=5
rate.limit.admin-verify-per-minute=20
rate.limit.webhook-per-minute-per-ip=60

# Redis (optional; if set, Redis-based limiter is used)
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.timeout=60000
spring.redis.connect-timeout=60000

# ========== OTP Verification Configuration ==========
# SMTP Configuration (Email OTP) - FREE
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.from=${SMTP_FROM_EMAIL:noreply@sabahub.com}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS_ENABLED:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Twilio Configuration (SMS OTP)
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+1234567890}

# OTP Settings
otp.expiration-minutes=10
otp.max-attempts=5
# Admin Account Initialization
admin.email=${ADMIN_EMAIL:admin@sabahub.local}
admin.password=${ADMIN_PASSWORD:Admin@123456}
