<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SabaHub Enterprise Platform — Context Use Case Diagram</title>

  <text x="1180" y="520">Analytics / BI</text>

  <ellipse cx="700" cy="520" rx="220" ry="26"

  <ellipse cx="700" cy="580" rx="230" ry="26"
