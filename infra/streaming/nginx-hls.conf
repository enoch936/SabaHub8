server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/hls_access.log;
    error_log /var/log/nginx/hls_error.log warn;

    location /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /hls {
        alias /var/www/hls;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Cache-Control "public, max-age=6" always;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/iso.segment m4s;
        }

        # Fallback for missing m3u8 files in development
        error_page 404 = @m3u8_fallback;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location @m3u8_fallback {
        if ($uri ~* \.m3u8$) {
            return 200 "#EXTM3U\n";
            add_header Content-Type application/vnd.apple.mpegurl;
        }
        return 404;
    }
}
