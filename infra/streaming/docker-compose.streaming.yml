version: "3.9"

name: sabahub-streaming

services:
  postgres:
    image: postgres:16-alpine
    container_name: sabahub-postgres
    environment:
      POSTGRES_DB: sabahub_streaming
      POSTGRES_USER: sabahub
      POSTGRES_PASSWORD: sabahub_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../backend-spring/src/main/resources/streaming/postgres-schema.sql:/docker-entrypoint-initdb.d/001-streaming-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabahub -d sabahub_streaming"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - streaming_net

  redis:
    image: redis:7-alpine
    container_name: sabahub-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - streaming_net

  kafka:
    image: bitnami/kafka:3.7
    container_name: sabahub-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: 12
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_KRAFT_CLUSTER_ID: MDEyMzQ1Njc4OTAxMjM0NQ
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
    networks:
      - streaming_net

  coturn:
    image: coturn/coturn:latest
    container_name: sabahub-coturn
    command:
      - -n
      - --realm=sabahub.local
      - --listening-port=3478
      - --tls-listening-port=5349
      - --fingerprint
      - --lt-cred-mech
      - --use-auth-secret
      - --static-auth-secret=sabahub_turn_secret
      - --no-multicast-peers
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49160-49200:49160-49200/udp"
    networks:
      - streaming_net

  janus:
    image: canyan/janus-gateway:latest
    container_name: sabahub-janus
    depends_on:
      - coturn
    environment:
      JANUS_LOG_LEVEL: "4"
    ports:
      - "8088:8088"
      - "8188:8188"
      - "10000-10100:10000-10100/udp"
    networks:
      - streaming_net

  mediamtx:
    image: bluenviron/mediamtx:1.8.4
    container_name: sabahub-mediamtx
    ports:
      - "1935:1935"
      - "9997:9997"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      STREAM_CALLBACK_BASE_URL: ${STREAM_CALLBACK_BASE_URL:-http://host.docker.internal:8080}
      STREAM_INGEST_CALLBACK_SECRET: ${STREAM_INGEST_CALLBACK_SECRET:-}
    networks:
      - streaming_net

  hls-origin:
    image: nginx:1.27-alpine
    container_name: sabahub-hls-origin
    ports:
      - "8081:80"
    volumes:
      - ./nginx-hls.conf:/etc/nginx/conf.d/default.conf:ro
      - hls_data:/var/www/hls
    networks:
      - streaming_net

  ffmpeg-worker:
    image: jrottenberg/ffmpeg:6.1-alpine
    container_name: sabahub-ffmpeg-worker
    command: >
      sh -c "echo 'Attach recorder/transcoder pipeline to Janus publisher feed in production';
      tail -f /dev/null"
    volumes:
      - hls_data:/var/www/hls
    depends_on:
      - janus
      - hls-origin
    networks:
      - streaming_net

  api:
    image: eclipse-temurin:21-jre
    container_name: sabahub-api-placeholder
    command: >
      sh -c "echo 'Run Spring Boot API in app environment; this container is a wiring placeholder';
      tail -f /dev/null"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sabahub_streaming
      SPRING_DATASOURCE_USERNAME: sabahub
      SPRING_DATASOURCE_PASSWORD: sabahub_dev_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JANUS_BASE_URL: http://janus:8088/janus
      TURN_UDP_URL: turn:localhost:3478?transport=udp
      HLS_PUBLIC_ORIGIN: http://localhost:8081/hls
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - streaming_net

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  hls_data:

networks:
  streaming_net:
    driver: bridge
